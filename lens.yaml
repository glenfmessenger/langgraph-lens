# langgraph-lens default config.
#
# Tier 1 (observability) is enabled by default — `LANGGRAPH_LENS=1` alone
# gives you everything in the first half of this file.
#
# Tier 2 (interventions) is OFF by default. Every block under `tier2:`
# is set to `enabled: false`. Flip the ones you want; leave the rest
# alone. Nothing is suppressed, blocked, redacted, or rate-limited
# unless you explicitly turn it on.

# ---------------------------------------------------------------------------
# Tier 1 — observability (zero-config defaults)
# ---------------------------------------------------------------------------

attack_surface:
  enabled: true
  rules:
    - pickle_checkpoint_backend
    - unsigned_prompt_registry
    - jinja2_template_format
    - permissive_recursion_limit
    - server_without_auth

checkpoint:
  enabled: true
  scan_on_write: true
  scan_on_read: true
  rules:
    - unsafe_pickle_opcode
    - unknown_serializer_kind
    - missing_thread_id
    - schema_drift
    - oversized_blob
  max_blob_bytes: 10485760  # 10 MiB

supply_chain:
  enabled: true
  scan_on_load: true
  formats:
    - jinja2
    - f_string
    - mustache
    - prompt_dir
  rules:
    - jinja_ssti
    - path_traversal
    - unsafe_chat_template
    - unsigned_hub_pull

tool:
  enabled: true
  rules:
    - shell_metachar
    - ssrf_pattern
    - out_of_allowlist
    - enumeration
    - oversized_args
  enumeration_window_seconds: 30
  enumeration_threshold: 8
  max_arg_bytes: 65536

memory:
  enabled: true
  rules:
    - system_prompt_override
    - oversized_entry
    - cross_tenant_key
  max_entry_bytes: 32768

pii:
  enabled: true
  scan_ingress: true
  scan_egress: true
  scan_checkpoints: true
  patterns:
    - type: ssn
    - type: credit_card
    - type: phone_us
    - type: phone_intl
    - type: email
    - type: ip_address
  custom_patterns: []

goal_hijack:
  enabled: true
  rules:
    - system_prompt_drift
    - tool_call_drift
    - off_topic_subgoal
  user_intent_similarity_threshold: 0.35
  watch_substrings:
    - transfer funds
    - send money
    - delete account
    - exfiltrate
    - curl http
    - wget http

comms:
  enabled: true
  rules:
    - undeclared_edge
    - recursion_exceeded
    - send_to_undeclared_target
    - oversized_state_growth
  state_growth_multiplier: 10.0

sql_injection:
  enabled: true
  rules:
    - union_select
    - comment_terminator
    - stacked_query
    - metadata_escape
  fields:
    - thread_id
    - checkpoint_ns
    - checkpoint_id

prometheus:
  enabled: true
  port: 9092

logging:
  enabled: true
  destination: stderr
  file_path: /var/log/langgraph-lens.jsonl
  format: json
  include_match_text: false

alerts:
  enabled: false
  slack_webhook: ""
  cooldown_seconds: 300
  alert_on:
    - supply_chain
    - attack_surface
    - checkpoint
    - goal_hijack

otel:
  enabled: false
  endpoint: http://localhost:4318
  service_name: langgraph-agent
  export_traces: true
  export_metrics: true

# ---------------------------------------------------------------------------
# Tier 2 — interventions (OFF by default)
#
# Every block under `tier2:` has `enabled: false`. Nothing is suppressed,
# blocked, redacted, or rate-limited unless you turn it on. Read the
# README and roll any new intervention out in `log` / `throttle` mode
# against production traffic before flipping to `block` / `enforce`.
# ---------------------------------------------------------------------------

tier2:
  pii_redaction:
    enabled: false
    mode: redact                       # redact | block
    patterns:
      - type: ssn
      - type: credit_card
      - type: email
      - type: phone_us
      - type: phone_intl
      - type: ip_address
    custom_patterns: []

  tool_allowlist:
    enabled: false
    mode: block                        # block | log
    # null = no allowlist enforcement; misuse rules still apply.
    allowed_tools: null
    block_on_rules:
      - shell_metachar
      - ssrf_pattern
      - oversized_args

  checkpoint_protector:
    enabled: false
    mode: enforce                      # enforce | log
    block_on_rules:
      - unsafe_pickle_opcode
    require_hmac: false
    signing_key: ""

  goal_guard:
    enabled: false
    mode: block                        # block | log
    block_on_rules:
      - system_prompt_drift
      - tool_call_drift

  rate_limit:
    enabled: false
    mode: throttle                     # throttle | block
    capacity: 60
    refill_per_second: 1.0
    size_divisor: 1000
    key_by_tenant: true
    key_by_thread: true
    key_by_tool: false

  circuit_breaker:
    enabled: false
    window_seconds: 30
    min_samples: 20
    error_rate_threshold: 0.5
    cooldown_seconds: 30
    fail_closed_on_attack: false
    fail_closed_min_severity: high
    fail_closed_attack_window_seconds: 60
    fail_closed_min_attack_signals: 5

  audit_signaling:
    enabled: false
    triggered_header: X-Lens-Triggered
    reason_header: X-Lens-Reason
    action_header: X-Lens-Action
    stamp_state: false
